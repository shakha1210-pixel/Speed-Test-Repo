[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speedtest-cli"
version = "1.1.0"
description = "Консольный замер скорости скачивания по заданному URL (без зависимостей)."
readme = "README.md"
requires-python = ">=3.9"
keywords = ["speedtest", "download", "network", "cli"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking :: Monitoring",
]

[project.scripts]
speedtest = "speedtest:main"

[tool.setuptools]
py-modules = ["speedtest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F"]
